name: DAST
# Verifica PRs antes da integração, main após push e execução manual.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# O token só precisa ler o repositório; os relatórios saem como artefato, não como issue.
permissions:
  contents: read
env:
  IMAGE_TAG: taskflow:dast
  TARGET: http://127.0.0.1:5000
jobs:
  zap:
    name: DAST - ZAP Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # SHA fixa o código da action; o Dependabot propõe atualizações.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build da imagem da TaskFlow
        run: docker build --tag "$IMAGE_TAG" .

      - name: Subir a TaskFlow dentro do runner
        run: |
          # Chave aleatória e efêmera: nenhum segredo real entra no scan.
          export TASKFLOW_SECRET_KEY="$(openssl rand -hex 32)"
          docker volume create taskflow-dast
          docker run --rm -e TASKFLOW_SECRET_KEY -v taskflow-dast:/app/data "$IMAGE_TAG" \
            flask --app 'app:create_app()' init-db
          # Mesmo runtime restrito do Compose: read-only, sem capabilities, debug desligado.
          # TASKFLOW_CSRF=0 só aqui: com o CSRF ligado, o ZAP reenvia tokens velhos, leva 400
          # e o payload de XSS nunca chega ao template (scan instável). Ver docs/dast.md.
          docker run -d --name taskflow-dast --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -v taskflow-dast:/app/data -e TASKFLOW_SECRET_KEY -e TASKFLOW_HTTPS=0 \
            -e TASKFLOW_DEBUG=0 -e TASKFLOW_CSRF=0 -p 127.0.0.1:5000:5000 "$IMAGE_TAG"

      - name: Espera ativa até a aplicação responder em /login
        run: |
          # Sem esta espera o ZAP atacaria o nada e o relatório sairia "limpo".
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$TARGET/login" > /dev/null; then
              echo "TaskFlow respondeu após ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::TaskFlow não respondeu em 60s"; docker logs taskflow-dast; exit 1

      - name: Permitir que o container do ZAP grave os relatórios no workspace
        run: chmod a+rwx "$GITHUB_WORKSPACE"

      # Gate passivo: -I não bloqueia WARN, mas qualquer regra FAIL do rules.tsv bloqueia.
      # Sem continue-on-error: o check vermelho é o que trava o merge.
      # "-c" explícito: a action só repassa rules_file_name ao ZAP se o arquivo tiver alguma
      # regra IGNORE. O nosso não tem, então sem o -c todo FAIL virava WARN e nada bloqueava.
      - name: ZAP Baseline (passivo)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j -I -c .zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      # Scan ativo curto: é ele que prova o XSS refletido do erro de login (regra 40012).
      # O baseline só observa respostas; não injeta payloads.
      - name: ZAP Full Scan (ativo, limitado a 10 min)
        if: ${{ !cancelled() }}
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.TARGET }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j -I -m 2 -T 10 -c .zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-full-scan-report

      - name: Logs da aplicação durante o scan
        if: always()
        run: docker logs taskflow-dast 2>&1 | tail -n 200; docker rm -f taskflow-dast || true
