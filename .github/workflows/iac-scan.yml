name: IaC Scan
# Sem filtro "paths:" de propósito: este é um required check, e um workflow que só roda
# quando um .tf muda deixaria PRs sem infra travados esperando um check que nunca chega.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform:
    name: IaC - Terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check -recursive
      # -backend=false: validar a sintaxe e os tipos não exige credencial da AWS no CI.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  checkov:
    name: IaC - Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # soft_fail desligado: qualquer check falho reprova. Exceções só via #checkov:skip
      # com justificativa no próprio recurso (infra/main.tf).
      - uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: .
          framework: terraform,dockerfile
          # codigo/ guarda os exemplos vulneráveis da disciplina, fora do produto.
          skip_path: codigo
          soft_fail: false
          quiet: true
          output_format: cli

  trivy-config:
    name: IaC - Trivy config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: 'v0.69.3'
          scan-type: config
          scan-ref: .
          skip-dirs: codigo
          severity: HIGH,CRITICAL
          # HIGH/CRITICAL em Terraform, Dockerfile ou Compose reprova o job.
          exit-code: '1'
          format: table
