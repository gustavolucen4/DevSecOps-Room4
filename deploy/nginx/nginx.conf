# Proxy da rede frontend. Única porta da aplicação publicada no host.
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  client_max_body_size 64k;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # Defesa em profundidade contra força bruta: 10 POSTs/min por IP no /login.
  # Fica comentado para a demo do Módulo 6 (o ataque precisa chegar na app e nos logs);
  # é a ação de CONTENÇÃO do runbook: descomentar e "docker compose restart proxy".
  # limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream taskflow { server app:5000; }

  server {
    listen 8080;

    location /login {
      # limit_req zone=login burst=5 nodelay;
      proxy_pass http://taskflow;
      proxy_set_header Host $host;
      # IP real do cliente para a app (ProxyFix confia em 1 salto) e para o Loki.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Mesmo ID no log do proxy e no log JSON da app.
      proxy_set_header X-Request-ID $request_id;
    }

    location / {
      proxy_pass http://taskflow;
      proxy_set_header Host $host;
      # IP real do cliente para a app (ProxyFix confia em 1 salto) e para o Loki.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Mesmo ID no log do proxy e no log JSON da app.
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
